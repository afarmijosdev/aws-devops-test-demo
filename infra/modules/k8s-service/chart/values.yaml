replicaCount: 1

image:
  repository: ""
  tag: latest
  pullPolicy: Always

containerPort: 8000

# Path used by the readiness and liveness probes.
healthPath: /openapi.json

env: {}

service:
  # ClusterIP keeps the service private; LoadBalancer exposes it publicly.
  type: ClusterIP
  port: 8000
  annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi
