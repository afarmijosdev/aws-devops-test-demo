name: Run DB migrations on EKS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: db-migrations image tag (latest or a commit SHA from the build workflow)
        required: true
        default: latest
      repair:
        description: Run "flyway repair" first (clears failed migrations from the history after you fix the script)
        type: boolean
        default: false

env:
  AWS_REGION: us-east-2
  EKS_CLUSTER: demo-eks
  NAMESPACE: bookstore
  RDS_IDENTIFIER: demo-sqlserver
  JOB_NAME: db-migrations
  JOB_TIMEOUT_SECONDS: 900

permissions:
  contents: read

# Never run two migrations at the same time.
concurrency:
  group: db-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configure kubectl for EKS
        run: |
          echo "AWS identity: $(aws sts get-caller-identity --query Arn --output text)"
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER"

      - name: Look up RDS endpoint
        id: rds
        run: |
          host=$(aws rds describe-db-instances \
            --db-instance-identifier "$RDS_IDENTIFIER" \
            --query 'DBInstances[0].Endpoint.Address' --output text)
          echo "host=$host" >> "$GITHUB_OUTPUT"

      - name: Create the Job
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/db-migrations:${{ inputs.image_tag }}
          DB_HOST: ${{ steps.rds.outputs.host }}
          FLYWAY_REPAIR: ${{ inputs.repair }}
        run: |
          # Jobs are immutable: remove the previous run before creating a new one.
          kubectl delete job "$JOB_NAME" -n "$NAMESPACE" --ignore-not-found --wait=true
          envsubst '${NAMESPACE} ${IMAGE} ${DB_HOST} ${FLYWAY_REPAIR}' \
            < hueca-bookstore/sqlcode/k8s/db-migrations-job.yaml \
            | kubectl apply -f -
          echo "Running $IMAGE against $DB_HOST (repair: $FLYWAY_REPAIR)" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for the Job to finish
        run: |
          deadline=$(( $(date +%s) + JOB_TIMEOUT_SECONDS ))
          while :; do
            conditions=$(kubectl get job "$JOB_NAME" -n "$NAMESPACE" \
              -o jsonpath='{.status.conditions[?(@.status=="True")].type}')
            case " $conditions " in
              *" Complete "*) echo "Job succeeded"; exit 0 ;;
              *" Failed "*)   echo "::error::Job $JOB_NAME failed"; exit 1 ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out after ${JOB_TIMEOUT_SECONDS}s waiting for $JOB_NAME"
              exit 1
            fi
            sleep 5
          done

      - name: Show Job logs
        if: always()
        run: |
          kubectl describe job "$JOB_NAME" -n "$NAMESPACE" || true
          kubectl logs -n "$NAMESPACE" -l job-name="$JOB_NAME" \
            --all-containers --prefix --tail=-1 || true
