name: Build and push images to ECR

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-2

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: be-inventory, dir: be-inventory }
          - { image: fe-inventory, dir: fe-inventory }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "${{ matrix.image }}" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "${{ matrix.image }}" \
                 --image-scanning-configuration scanOnPush=true

      - name: Build and push
        working-directory: hueca-bookstore
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ matrix.image }}
        run: |
          docker build --platform linux/amd64 \
            -f ${{ matrix.dir }}/Dockerfile \
            -t "$IMAGE:${GITHUB_SHA::7}" \
            -t "$IMAGE:latest" .
          docker push --all-tags "$IMAGE"
          echo "Pushed $IMAGE:${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
