name: Build and push Flyway image to ECR

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  IMAGE_NAME: db-migrations

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$IMAGE_NAME" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$IMAGE_NAME" \
                 --image-scanning-configuration scanOnPush=true

      - name: Build and push
        working-directory: hueca-bookstore
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_NAME }}
        run: |
          docker build --platform linux/amd64 \
            -f sqlcode/Dockerfile \
            -t "$IMAGE:${GITHUB_SHA::7}" \
            -t "$IMAGE:latest" .
          docker push --all-tags "$IMAGE"
          echo "Pushed $IMAGE:${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
